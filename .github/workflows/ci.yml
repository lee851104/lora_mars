name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # CPU-only: the GPU extra (torch/unsloth) is deliberately not installed,
      # so every test here must run without CUDA and without downloading a model.
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest -v

      # The leakage suite is the reason this pipeline exists - fail the build
      # loudly and separately if it ever regresses.
      - name: No-leakage guarantee
        run: uv run pytest tests/test_no_leakage.py -v
