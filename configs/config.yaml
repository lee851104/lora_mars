# 唯一的超參數來源。程式碼裡不允許出現硬編碼的數字或路徑。
# CLI 覆寫：  make train OVERRIDE="train.max_steps=60 lora.r=32"

seed: 3407

paths:
  raw_dir:       data/raw
  processed_dir: data/processed
  splits_dir:    data/splits
  models_dir:    models
  reports_dir:   reports
  figures_dir:   reports/figures
  outputs_dir:   outputs

data:
  hf_repo:       AIOmarRehan/space-multimodal-dataset
  hf_split:      train
  images_subdir: images
  metadata_file: data.json

features:
  # conservative = 只做空白正規化，保留大小寫、標點、數字
  # aggressive   = 原專案做法：全轉小寫並刪除所有非字母字元
  #                會摧毀 "M31" / "Apollo 11" 這類天文專有名詞，預設不用
  # none         = 完全不動
  clean_mode: conservative
  drop_duplicate_captions: true
  min_caption_chars: 10

split:
  # 這裡是切分的唯一定義處。改動任何一項都會讓 manifest 的 hash 改變，
  # 舊模型的 train_meta.json 就對不上，tests/test_no_leakage.py 會失敗。
  test_size: 0.1
  val_size:  0.1
  seed: 42
  stratify_by: label      # null 可關閉分層抽樣

model:
  # 預設 Gemma 3 4B IT：4-bit 只有 4.25 GiB、unsloth 鏡像沒有 gated。
  # 換模型用 `make train MODEL=qwen2_5_vl_7b`，可選的預設見 configs/models/README.md。
  # Gemma 3 在 T4（無 bf16）上的數值注意事項寫在 configs/models/gemma3_4b.yaml。
  base_id: unsloth/gemma-3-4b-it-unsloth-bnb-4bit
  load_in_4bit: true
  use_gradient_checkpointing: unsloth
  max_seq_length: 2048
  local_files_only: false
  min_free_vram_gb: 5.5   # 低於此值就拒絕載入，並提示重啟（避免殘留顯存造成的 OOM）
  # 動態解析度的架構（Qwen2-VL 系列）處理器預設上限 12.8M 像素，一張大圖就能產生
  # 上萬個 vision token，在 T4 上必爆，所以那些預設會夾到 768x768（約 750 個 token）。
  # null = 不動處理器預設。Gemma 3 是 SigLIP 固定 896x896、mllama 是固定 tiling，
  # 兩者都沒有這個旋鈕，設 null。
  image_max_pixels: null
  license_notice: >-
    基礎模型 Gemma 3 4B IT，使用受 Google Gemma Terms of Use 與
    Prohibited Use Policy 約束；再散布時必須一併傳遞這些使用限制。

lora:
  r: 16
  alpha: 16               # 經驗法則：alpha >= r
  dropout: 0.0
  bias: none
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  use_rslora: false
  # ── 權重下載（後面填）────────────────────────────────────
  # repo_id 填好後跑 `make weights`，會抓到 local_dir；
  # 服務與評估都優先讀 local_dir，抓不到才退回 repo_id。
  repo_id: null
  local_dir: models/lora

upload:
  # `make upload` 把 models/lora/ 推到 Hugging Face。
  # Space 讀不到你本機的權重，所以要先上傳。
  repo_id: null              # 空的話沿用 lora.repo_id
  private: false             # Space 要讀就設 false，否則 Space 要另外給 HF_TOKEN
  commit_message: "upload LoRA adapter"
  source_url: "https://github.com/lee851104/lora_mars"

train:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4    # 有效 batch = 8
  warmup_steps: 5
  max_steps: 30                     # 設 null 改用 num_train_epochs
  num_train_epochs: null
  learning_rate: 2.0e-4
  weight_decay: 0.01
  lr_scheduler_type: linear
  logging_steps: 1
  optim: adamw_8bit
  save_adapter: true

eval:
  instruction: "You are an expert astronomer. Describe accurately what you see in this image."
  split: test                # 只准是 test 或 val，程式會擋住 train
  max_new_tokens: 128
  # 評估一律 greedy：要可重現。do_sample=false 時 temperature/top_p 會被丟掉，
  # 不會像原本那樣傳了 temperature 卻被 transformers 靜默忽略。
  do_sample: false
  temperature: null
  top_p: null
  save_predictions: true     # score 階段要讀這個檔，關掉就只能一次跑完
  # false = 只跑基礎模型，產生成果表的 Base 對照欄（`make eval-base`）。
  # 檔名會自動加 _base 後綴，不會蓋掉 LoRA 的報告。
  use_adapter: true

  # 要算哪些指標。可選：clipscore / llm_judge / bleu_rouge
  # BLEU/ROUGE 留著是為了跟原始 notebook 對照，但它們量不到事實正確性——
  # 一個把星系名稱全講錯、句型卻一致的輸出可以拿到很高的分數，所以不是預設。
  metrics: [clipscore, llm_judge]

  bootstrap_samples: 1000
  bootstrap_seed: 0

clipscore:
  # 無參考指標：直接量「圖片」與「生成描述」在 CLIP 空間的餘弦相似度，
  # 不看參考句子，所以量的是圖文對齊而不是字面重疊。
  model_id: openai/clip-vit-large-patch14
  device: auto               # auto | cpu | cuda（VLM 還佔著顯存時建議 cpu）
  batch_size: 8
  scale: 2.5                 # 標準 CLIPScore 的縮放常數 w
  # CLIP 文字編碼器硬上限 77 個 token。超過的會被截斷，報告會列出被截斷筆數——
  # 截斷比例高的話，分數只反映了描述的前半段。
  max_text_tokens: 77

llm_judge:
  # 把圖片、參考描述、模型輸出一起交給一個看得見圖的模型評分。
  # 這是這裡唯一能量到「有沒有幻覺」的指標，但它是模型意見，不是 ground truth。
  provider: anthropic
  model: claude-opus-5
  # Opus 5 不接受 temperature（會回 400），所以不要在這裡加。
  # 用 effort 控制思考深度：low / medium / high / xhigh / max
  effort: medium
  max_tokens: 8192
  send_image: true           # false 就只比對文字，會完全量不到幻覺
  max_image_edge: 1024       # 送出前先縮到長邊 1024：省 input token，不影響判斷
  concurrency: 4
  max_samples: null          # null = 全部；先試跑可以設 5
  enable_fallbacks: true     # 遇到 refusal 時走伺服器端 fallback
  cost_estimate_only: false  # true = 只印預估花費，不真的呼叫 API

serving:
  host: 0.0.0.0
  port: 7860
  share: false
  default_instruction: "You are an expert astronomer. Describe accurately what you see in this image."
  max_new_tokens: 256
  do_sample: true
  temperature: 1.0
  top_p: 0.9
